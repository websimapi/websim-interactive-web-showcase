        <svg viewBox="0 0 100 100" class="circle">
          <circle cx="50" cy="50" r="40" fill="none" stroke="#3498db" stroke-width="10" />
        </svg>
      </div>
      <button class="btn" id="animateBtn">Start Animation</button>
    </section>
    <section class="card" id="card2">
      <h2>Click to Reveal</h2>
      <p class="hidden-text">Surprise! This is a secret message revealed by clicking the button below.</p>
      <button class="btn" id="revealBtn">Reveal Message</button>
    </section>
  </main>
  <footer>
    <p>&copy; 2023 Interactive Showcase. Explore and Enjoy!</p>
